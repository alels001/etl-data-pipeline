[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "off-pipeline"
version = "0.2.0"
description = "Medallion lakehouse pipeline (PySpark + Delta Lake) for Open Food Facts product data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ali Elshafey" }]
dependencies = [
    "pyspark>=4.0,<4.1",
    "delta-spark>=4.0,<4.1",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end run with Delta Lake (downloads the Delta jars from Maven on first run)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# The v1 prototype notebook is kept unchanged as a record of where the project started
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
